# English Learning Agent Preset
# Composition for English learning: material digest, vocabulary extraction, exercise generation

# Core
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: scope
  name: '@deepseek-ai/dsh-scope'

# LLM
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# Web (search/fetch learning materials)
- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-search-exa
  name: '@deepseek-ai/dsh-web-search-exa'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  inject: [tools, web]

# Skill system
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  inject: [skills]

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  inject: [tools, skills]

# Note: The following tools are referenced in skills but don't exist as separate packages:
# - tool-material (parse_material)
# - tool-vocabulary (add_vocabulary, search_vocabulary)
# - tool-exercise (generate_listening, generate_speaking, etc.)
# These would need to be implemented as separate tool packages or provided by a bundle.

# Config for the preset
config:
  llm:
    provider: deepseek
    model: deepseek-chat
  web:
    search:
      provider: exa
      # apiKey: ${EXA_API_KEY}  # needs configuration
  skills:
    roots:
      - ./skills  # use preset's built-in skills