# English Learning Agent Preset
# Composition for English learning: material digest, vocabulary extraction, exercise generation

# Core
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: scope
  name: '@deepseek-ai/dsh-scope'

# LLM
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# Web (search/fetch learning materials)
- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-search-exa
  name: '@deepseek-ai/dsh-web-search-exa'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  inject: [tools, web]

# Skill system
- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  inject: [skills]

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  inject: [tools, skills]

# Note: the skills rely on the stock tool set only: `read` for material files and
# `web_search` for finding materials. The dashboard bundle (dsh-english-learning)
# registers this preset's skills/ directory as an extra skill root at runtime.

# Config for the preset
config:
  llm:
    provider: deepseek
    model: deepseek-chat
  web:
    search:
      provider: exa
      # apiKey: ${EXA_API_KEY}  # needs configuration
  skills:
    roots:
      - ./skills  # use preset's built-in skills